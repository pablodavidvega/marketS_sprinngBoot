<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Prueba Pago - MarketS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/CSS/buttons.css}">
    <style>
        body { font-family: Arial; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; }
        button { background: #009ee3; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>💳 Probar Pago MercadoPago</h1>

    <form th:action="@{/pago/crear}" method="post">
        <div class="form-group">
            <label>Pedido ID:</label>
            <input type="text" name="pedidoId" th:value="${pedidoId}" readonly>
        </div>

        <div class="form-group">
            <label>Monto (COP):</label>
            <input type="number" name="monto" th:value="${monto}" min="10000" step="1000">
            <small>Mínimo: 10,000 COP</small>
        </div>

        <div class="form-group">
            <label>Descripción:</label>
            <input type="text" name="descripcion" th:value="${descripcion}">
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" th:value="${email}">
        </div>

        <button type="submit" class="btn btn-primary">Pagar ahora</button>
    </form>

    <hr>

    <h3>🚀 Prueba RÁPIDA:</h3>
    <a th:href="@{/pago/pago-rapido}">Pagar $15,000 COP (sin formulario)</a>

    <hr>

    <h3>🔧 Diagnóstico:</h3>
    <a th:href="@{/pago/test-conexion}" target="_blank">Probar conexión MercadoPago</a>
</div>
</body>
</html>
