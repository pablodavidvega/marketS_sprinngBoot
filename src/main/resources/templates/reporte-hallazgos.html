<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Informe de pruebas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/CSS/buttons.css}">
</head>
<body>
<h2>Informe de Pruebas</h2>
<table border="1">
    <thead>
    <tr>
        <th>#</th>
        <th>Prueba</th>
        <th>Tipo</th>
        <th>Resultado</th>
        <th>Descripción</th>
        <th>Fecha</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="h, iterStat : ${hallazgos}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${h.prueba}"></td>
        <td th:text="${h.tipo}"></td>
        <td th:text="${h.resultado}"></td>
        <td th:text="${h.descripcion}"></td>
        <td th:text="${h.fecha}"></td>
    </tr>
    </tbody>
    <a class="btn btn-success" href="/admin/reporte-hallazgos/pdf" target="_blank">
        Descargar PDF
    </a>
</table>
</body>
</html>
