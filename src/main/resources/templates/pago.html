<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pago - MarketS</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h1>Página de Pago</h1>

    <div th:if="${mensaje}" class="success">
        <p th:text="${mensaje}"></p>
    </div>

    <div th:if="${pedido}">
        <h2>Pedido #<span th:text="${pedido.id}"></span></h2>
        <p><strong>Total:</strong> $<span th:text="${pedido.total}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${pedido.estado}"></span></p>
        <p><strong>Fecha:</strong> <span th:text="${pedido.fecha}"></span></p>

        <div th:if="${paymentUrl}">
            <h3>Pagar con MercadoPago</h3>
            <a th:href="${paymentUrl}" style="background: #009ee3; color: white; padding: 10px 20px; text-decoration: none;">
                Ir a MercadoPago
            </a>
        </div>

        <div th:unless="${paymentUrl}">
            <p class="error">MercadoPago no está disponible</p>
            <form th:action="@{'/pedido/pagar/' + ${pedido.id}}" method="post">
                <input type="hidden" name="origen" value="directo">
                <button type="submit" style="background: #6c757d; color: white; padding: 10px 20px; border: none;">
                    Marcar como Pagado (Prueba)
                </button>
            </form>
        </div>
    </div>

    <div th:unless="${pedido}">
        <p class="error">No hay pedido para mostrar</p>
        <a href="/carrito">Volver al carrito</a>
    </div>

    <hr>
    <a href="/carrito">← Volver al Carrito</a> |
    <a href="/productos/index">Seguir Comprando</a>
</div>
</body>
</html>
