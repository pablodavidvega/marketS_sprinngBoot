<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña | MarketS</title>

    <link rel="stylesheet" th:href="@{/CSS/style.css}">
    <link rel="icon" type="image" th:href="@{/img/logo.png}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
    <div class="header_container">

        <div class="logo">
            <img th:src="@{/img/icon.jpg}" alt="Logo">
            <h2 class="name-project">MarketS</h2>
        </div>

        <nav class="nav-menu">

            <a th:href="@{/login}">
                <button class="btn6"><strong>Iniciar sesión</strong></button>
            </a>

            <button id="toggle-dark-mode" class="modo-btn">
                <i class="fa-solid fa-moon"></i>
                <span class="modo-text">Modo Oscuro</span>
            </button>

        </nav>
    </div>
</header>


<!-- CONTENIDO -->

<section class="auth-container">

    <div class="auth-card">

        <h2>Recuperar contraseña</h2>

        <p class="auth-subtitle">
            Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form th:action="@{/forgot-password}" method="post">

            <div class="auth-input">
                <i class="fa-solid fa-envelope"></i>
                <input type="email"
                       name="email"
                       placeholder="Correo electrónico"
                       required>
            </div>

            <button type="submit" class="btn-auth">
                Enviar enlace
            </button>

        </form>

        <p class="auth-msg error" th:text="${error}"></p>
        <p class="auth-msg success" th:text="${mensaje}"></p>

        <a th:href="@{/login}" class="auth-link">
            Volver al login
        </a>

    </div>

</section>


<footer>
    <div class="footer-col">
        <h4>Nuestras Redes</h4>
        <div class="links">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        </div>
    </div>

    <div class="footer-col">
        <h4>Contacto</h4>
        <ul class="info">
            <li>
                <span><i class="fa-solid fa-phone"></i></span>
                <p>+57 123 4567 890</p>
            </li>
            <li>
                <span><i class="fa-solid fa-envelope"></i></span>
                <p>MarketS@gmail.com</p>
            </li>
        </ul>
    </div>
</footer>

<script th:src="@{/JS/cambioColor.js}" defer></script>

</body>
</html>
