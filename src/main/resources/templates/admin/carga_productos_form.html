<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de carga de productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Cargar productos</h2>
    <form action="/admin/carga-productos/subir" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="archivo" class="form-label">Selecciona archivo CSV o Excel:</label>
            <input type="file" name="archivo" id="archivo" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Subir archivo</button>
    </form>

    <!-- Mensajes y errores -->
    <div th:if="${mensaje}" class="mt-3">
        <div class="alert alert-info" th:text="${mensaje}"></div>
        <div th:if="${errores != null && !#lists.isEmpty(errores)}" class="mt-2">
            <h5>Errores:</h5>
            <ul>
                <li th:each="error : ${errores}" th:text="${error}"></li>
            </ul>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
