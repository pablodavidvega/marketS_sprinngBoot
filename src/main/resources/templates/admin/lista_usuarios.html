<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Usuarios</title>
  <link rel="stylesheet" th:href="@{/CSS/admindashboard.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/CSS/buttons.css}">
</head>
<body>
<header class="top-navbar">
  <div id="logoToggle" class="logo">MS</div>
  <div class="navbar-title">Panel de Administrador</div>
  <div class="user-info">
  </div>
</header>

<div class="wrapper">
  <aside id="sidebar" class="sidebar">
    <ul>
      <li><a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> <span>Inicio</span></a></li>

      <li class="active"><a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> <span>Usuarios</span></a></li>
      <li><a th:href="@{/admin/usuarios/nuevo-admin}"><i class="fas fa-user-plus"></i> <span>Agregar Admin</span></a></li>
      <li>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="logout-btn"><i class="fas fa-sign-out-alt"></i> <span>Salir</span></button>
        </form>
      </li>
    </ul>
  </aside>

  <main class="dashboard-main">
      <a th:href="@{/admin/dashboard}" class="btn-back">
          <i class="fas fa-arrow-left"></i> Volver al panel
      </a>
    <h1 class="dashboard-tittle">Lista de Usuarios</h1>
    <form th:action="@{/admin/usuarios/filtrar}" method="get" class="filtro-form">
      <input type="text" name="valor" placeholder="Buscar..." style="flex:1;">
      <select name="tipo">
        <option value="todos">Todos</option>
        <option value="nombre">Nombre</option>
        <option value="email">Email</option>
        <option value="direccion">Dirección</option>
        <option value="rol">Rol</option>
      </select>
      <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Buscar</button>
    </form>

    <p th:if="${mensaje}" th:text="${mensaje}"></p>
    <a class="btn-mercadopago" th:href="@{/admin/usuarios/reporte-pdf}">
      <i class="fas fa-file-pdf"></i> Lista de usuarios
    </a>

    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Dirección</th>
        <th>Rol</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.id}"></td>
        <td th:text="${usuario.username}"></td>
        <td th:text="${usuario.email}"></td>
        <td th:text="${usuario.phone}"></td>
        <td th:text="${usuario.address}"></td>
        <td th:text="${usuario.rol.rolname}"></td>

          <td>
              <form th:action="@{'/admin/usuarios/editar/' + ${usuario.id}}" method="post" style="display: inline;">
                  <select class="select-rol-admin" name="rolId">
                      <option th:each="rol : ${roles}"
                              th:value="${rol.id}"
                              th:text="${rol.rolname}"
                              th:selected="${rol.id == usuario.rol.id}">
                      </option>
                  </select>
                  <button class="btn btn-save-admin btn-sm" type="submit">
                      Guardar
                  </button>
              </form>

              <!-- Botón eliminar -->
              <form th:action="@{|/admin/eliminar/${usuario.id}|}" method="post"
                    onsubmit="return confirm('¿Seguro que deseas eliminar este usuario?');">
                  <button class="btn btn-delete-admin btn-sm" type="submit">Eliminar</button>
              </form>
          </td>
      </tr>
      </tbody>
    </table>
  </main>
</div>

<script>
  const logo = document.getElementById('logoToggle');
  const sidebar = document.getElementById('sidebar');
  let expanded = false;
  logo.addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
    expanded = !expanded;
    logo.textContent = expanded ? 'MS' : 'MarketS';
  });
</script>
</body>
</html>
