<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enviar Correos</title>
    <link rel="stylesheet" th:href="@{/css/admindashboard.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="top-navbar">
    <div id="logoToggle" class="logo">MS</div>
    <div class="navbar-title">Panel de Administrador</div>
    <div></div>
</header>

<div class="wrapper">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar collapsed">
        <ul>
            <li th:class="'menu-item ' + (${activePage} == 'dashboard' ? 'active' : '')">
                <a th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> <span>Inicio</span></a>
            </li>
            <li th:class="'menu-item ' + (${activePage} == 'usuarios' ? 'active' : '')">
                <a th:href="@{/admin/usuarios}"><i class="fas fa-users"></i> <span>Usuarios</span></a>
            </li>
            <li th:class="'menu-item ' + (${activePage} == 'nuevoAdmin' ? 'active' : '')">
                <a th:href="@{/admin/usuarios/nuevo-admin}"><i class="fas fa-user-plus"></i> <span>Agregar Admin</span></a>
            </li>
            <li th:class="'menu-item ' + (${activePage} == 'enviarCorreos' ? 'active' : '')">
                <a th:href="@{/admin/enviar-correo}"><i class="fas fa-envelope"></i> <span>Enviar Correos</span></a>
            </li>
            <li>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> <span>Salir</span>
                    </button>
                </form>
            </li>
        </ul>
    </aside>

    <!-- Contenido principal -->
    <main class="dashboard-main">
        <h1><i class="fas fa-envelope"></i> Enviar Correos</h1>
        <a th:href="@{/admin/dashboard}" class="btn-volver">
            <i class="fas fa-arrow-left"></i> Volver al panel
        </a>

        <div class="cards">
            <div class="card-form">
                <form th:action="@{/enviar-correo/varios}" method="post" enctype="multipart/form-data" class="form-correo">

                    <!-- Destinatarios manuales -->
                    <div class="form-group">
                        <label for="destinatarios">Destinatarios</label>
                        <textarea id="destinatarios" name="destinatarios" rows="3"
                                  placeholder="Ingresa correos separados por comas o saltos de línea"></textarea>
                        <small>Opcional: deja en blanco si solo usarás CSV.</small>
                    </div>

                    <!-- Archivo CSV -->
                    <div class="form-group">
                        <label for="archivo">Archivo CSV</label>
                        <input type="file" id="archivo" name="archivo" accept=".csv">
                        <small>Opcional: CSV con lista de correos.</small>
                    </div>

                    <!-- Asunto -->
                    <div class="form-group">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto" placeholder="Escribe el asunto" required>
                    </div>

                    <!-- Mensaje -->
                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe el mensaje aquí" required></textarea>
                    </div>

                    <button type="submit" class="btn-enviar">
                        <i class="fas fa-paper-plane"></i> Enviar
                    </button>
                </form>
            </div>
        </div>

        <div id="alerta-exito" class="alerta-exito" th:if="${correoEnviado}">
            <i class="fas fa-check-circle"></i> ¡Correo enviado correctamente!
        </div>
    </main>
</div>
<!-- MODAL -->
<div id="modalCorreo" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h2>Resultado del envío</h2>
        <p id="modalMensaje"></p>
        <button id="modalCerrar">Cerrar</button>
    </div>
</div>



<script>
    const logo = document.getElementById('logoToggle');
    const sidebar = document.getElementById('sidebar');
    let expanded = false;
    logo.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        expanded = !expanded;
        logo.textContent = expanded ? 'MarketS' : 'MS';
    });
    
    const formCorreo = document.querySelector(".form-correo");

    formCorreo.addEventListener("submit", function(e){
        e.preventDefault(); // evita refrescar la página

        const formData = new FormData(formCorreo);

        fetch(formCorreo.action, {
            method: "POST",
            body: formData
        })
        .then(r => r.text())
        .then(texto => {
            document.getElementById("modalMensaje").textContent = texto;
            document.getElementById("modalCorreo").style.display = "flex";
        })
        .catch(err => {
            document.getElementById("modalMensaje").textContent = "Error al enviar: " + err;
            document.getElementById("modalCorreo").style.display = "flex";
        });
    });

    document.getElementById("modalCerrar").addEventListener("click", ()=>{
        document.getElementById("modalCorreo").style.display = "none";
    });

</script>
</body>
</html>
