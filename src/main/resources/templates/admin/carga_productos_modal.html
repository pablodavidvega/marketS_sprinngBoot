<!-- src/main/resources/templates/admin/carga_productos_modal.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resultado de carga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Resultado de la carga de productos</h2>

    <p th:text="${mensaje}"></p>

    <div th:if="${errores != null && !#lists.isEmpty(errores)}">
        <h4>Errores:</h4>
        <ul>
            <li th:each="error : ${errores}" th:text="${error}"></li>
        </ul>
    </div>

    <a href="/admin/carga-productos/form" class="btn btn-secondary mt-3">Volver al formulario</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
