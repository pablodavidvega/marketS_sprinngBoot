server.port=${PORT:8080}

# postgres supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# jpa
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# app
app.url=${APP_URL}
app.upload.path=${UPLOAD_PATH:/tmp/uploads/}

# mercado pago
mercado.pago.access.token=${MERCADO_PAGO_ACCESS_TOKEN}

# mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# logs
logging.level.org.springframework=INFO

# JWT (variable de entorno obligatoria en producción)
jwt.secret=${JWT_SECRET}

# CORS (configura el dominio de tu frontend en Render/Vercel)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tu-dominio.com}