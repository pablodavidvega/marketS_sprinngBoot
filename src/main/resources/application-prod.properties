server.port=${PORT:8080}

# postgres supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# jpa
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# app
app.url=${APP_URL}
app.upload.path=${UPLOAD_PATH:/tmp/uploads/}

# mercado pago — credenciales de la app "MS2Version" en el panel de desarrolladores de MP (Marketplace/OAuth)
mercado.pago.client.id=${MERCADO_PAGO_CLIENT_ID:}
mercado.pago.client.secret=${MERCADO_PAGO_CLIENT_SECRET:}

# mail — SMTP declarado para que Spring cree el bean (no se usa en prod)
# El envío real usa la API HTTP de Resend (puerto 443, sin restricciones en Render)
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Resend HTTP API
resend.api.key=${RESEND_API_KEY}
app.mail.from=${MAIL_FROM}

# errores — nunca exponer el mensaje de la excepción al cliente (puede filtrar detalles internos
# como nombres de tabla/columna en errores de SQL, rutas de archivo, etc.). El catch-all de
# GlobalExceptionHandler ya evita que esto llegue a importar en la práctica, pero esto es la
# segunda capa por si algo se escapa antes de llegar a un @RestController (ver application.properties).
server.error.include-message=never

# logs
logging.level.org.springframework=INFO

# JWT (variable de entorno obligatoria en producción)
jwt.secret=${JWT_SECRET}

# Login con Google (variable de entorno obligatoria en producción)
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# Frontend React en producción
app.frontend.url=${FRONTEND_URL:https://tu-frontend.vercel.app}

# CORS (configura el dominio de tu frontend en Render/Vercel)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tu-dominio.com}

# Cookie JWT (prod: HTTPS obligatorio, SameSite=None para frontend en dominio distinto)
cookie.secure=true
cookie.samesite=None

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:https://wsnfaxuxgbtzefhexhyi.supabase.co}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET:productos}