spring.application.name=MarketS

# ===============================
# PUERTO (Render lo asigna automático)
# ===============================
server.port=${PORT:8080}

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.MarketS=DEBUG

# ===============================
# BASE DE DATOS (PostgreSQL - Supabase)
# DB_URL debe incluir ?sslmode=require al final
# Ejemplo: jdbc:postgresql://db.xxxx.supabase.co:5432/postgres?sslmode=require
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP - Pool de conexiones
# Supabase plan gratuito permite max ~20 conexiones directas
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# CORREO (Gmail)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# MERCADO PAGO
# ===============================
mercado.pago.access.token=${MERCADO_PAGO_ACCESS_TOKEN}

# ===============================
# URL DE LA APP
# ===============================
app.url=${APP_URL}

# ===============================
# ARCHIVOS SUBIDOS
# En Render usar: /tmp/uploads/ (filesystem efímero)
# En Windows local usar: file:///C:/uploads/hana/
# ===============================
app.upload.path=${UPLOAD_PATH:/tmp/uploads/}

# ===============================
# ERRORES
# ===============================
server.error.include-stacktrace=never
server.error.include-message=always
