spring.application.name=MarketS

# ===============================
# BASE DE DATOS - SUPABASE (POSTGRESQL)
# ===============================
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
# ===============================
# PUERTO (Render lo asigna automático)
# ===============================

server.port=${PORT:8080}

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# ===============================
# LOGGING
# ===============================

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# CORREO (MEJOR PONER COMO VARIABLES)
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:pablo.david.vega1@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

mercado.pago.access.token=${MERCADO_PAGO_ACCESS_TOKEN}
APP_URL=https://markets-sprinngboot-3.onrender.com
app.url=${APP_URL}
MercadoPagoConfig.setAccessToken(token);


# ERRORES

server.error.include-stacktrace=never
server.error.include-message=always
