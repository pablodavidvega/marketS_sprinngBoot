spring.application.name=MarketS

# perfil activo por defecto local
spring.profiles.active=dev

# multipart — 3 imágenes + video por producto
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=350MB

# recursos est�ticos
spring.web.resources.cache.period=0

# jpa com�n
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# logs base
logging.level.root=INFO

# errores — "always" es cómodo en dev local; application-prod.properties lo sobreescribe a
# "never" porque el mensaje de la excepción puede filtrar detalles internos al cliente.
server.error.include-stacktrace=never
server.error.include-message=always

# JWT — TTL absoluto del token; el frontend lo renueva vía /api/auth/refresh mientras
# el usuario esté activo, así que esto es el margen antes de que una sesión inactiva expire.
jwt.expiration=1800000

# Login con Google — TTL del token de "alta pendiente" (paso intermedio entre verificar el
# id_token y que el usuario complete rol/teléfono/dirección), en milisegundos.
google.oauth.pending-token.expiration=600000

# Resend HTTP API (vacío en dev → usa SMTP local con Gmail)
resend.api.key=

# Frontend React (dev apunta a Vite/CRA, prod se sobreescribe en application-prod.properties)
app.frontend.url=http://localhost:3000

# ── Configuración visual de la app ──────────────────────────────────────────
# Estos valores se pueden sobreescribir con variables de entorno en producción:
# APP_NOMBRE, APP_COLOR_PRIMARIO, APP_LOGO_URL, APP_DESCRIPCION
app.nombre=MarketS
app.color.primario=#2563eb
app.logo.url=
app.descripcion=Marketplace interno de tu empresa